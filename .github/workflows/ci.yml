name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Linux builds hidapi from source (FetchContent), which needs libudev headers
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      # macOS installs hidapi so the find_package() path gets exercised;
      # Linux and Windows exercise the FetchContent fallback
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install hidapi

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release
